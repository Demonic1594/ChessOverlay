# Builds and tests the APK. Runs for pull requests, pushes to main and by
# hand; the jobs:
# - apk: Smotherfish for arm64 (Android NDK) bundled as libsmotherfish.so,
#   the recognition models, the unit tests (the recognizer against
#   chessimg2pos's recorded Python output), then app-release.apk as an
#   artifact. For pushes to main and runs by hand it is signed with the
#   project key (secrets ANDROID_KEYSTORE_*), so that a newer build installs
#   over an older one; a pull request's APK with the debug key of the build
#   machine, a new one each run (README, Builds);
# - engine-arm64: the engine from that APK on real arm64 hardware, run by the
#   app's own engine code;
# - device: the app on an x86_64 emulator, with an x86_64 Smotherfish.
# The engine is built from ENGINE_REF: the commit pinned below, so that a
# build can be repeated and the APK's engine source is known (see
# THIRD_PARTY_NOTICES.md), unless the workflow is run by hand with another
# branch, tag or commit.
name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      engine_ref:
        description: "Smotherfish branch, tag or commit to bundle"
        required: false
        default: "smotherfish"

env:
  # The Smotherfish commit bundled by default: the head of its branch
  # `smotherfish` on 2026-11-23, built and tested by the run of that day.
  # To move on, change this commit (and THIRD_PARTY_NOTICES.md with it).
  ENGINE_REF: ${{ github.event.inputs.engine_ref || '33bbe36148e42b08e496027a48dc227212845ebd' }}
  NDK_VERSION: "27.2.12479018"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Recognition models (cached)
        uses: actions/cache@v4
        with:
          path: models
          key: chessimg2pos-v2-onnx-0.2.0

      - name: Download recognition models
        run: |
          if [ ! -f models/board.onnx ]; then
            mkdir -p models
            curl -fsSL -o models/v2.zip https://github.com/mdicio/chessimg2pos/releases/download/v0.2.0/chessimg2pos-v2-onnx.zip
            unzip -q -o models/v2.zip -d models && rm models/v2.zip
          fi
          ls -la models

      # The APK carries the models: the board model quantized to int8 (same
      # readings, about twice as fast, 38 MB instead of 125 MB), checked by
      # QuantizedModelTest below.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bundle the recognition models
        run: |
          python3 -m venv /tmp/quant
          /tmp/quant/bin/pip install --quiet "onnxruntime==1.20.1" "onnx==1.17.0"
          /tmp/quant/bin/python tools/quantize_models.py models app/src/main/assets/models

      # The benchmark of board reading: boards as lichess shows them, rendered
      # with Chrome (BenchTest reads the directory; its table is uploaded).
      - name: Benchmark boards
        run: |
          python3 -m venv /tmp/bench
          /tmp/bench/bin/pip install --quiet "chess==1.11.2"
          /tmp/bench/bin/python tools/bench/gen.py "$GITHUB_WORKSPACE/build/bench" --boards 200

      - name: Unit tests
        run: |
          MODELS="$GITHUB_WORKSPACE/models" QMODELS="$GITHUB_WORKSPACE/app/src/main/assets/models" BENCH="$GITHUB_WORKSPACE/build/bench" \
            ./gradlew --no-daemon :core:test testDebugUnitTest

      # The engine comes after the tests: a change in the Kotlin shows in the
       # tests a few minutes sooner, and they do not need it.
      - name: Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
          echo "NDK_BIN=$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_ENV"

      - name: Build Smotherfish (arm64, static)
        run: |
          git init -q engine
          git -C engine remote add origin https://github.com/Demonic1594/Smotherfish.git
          git -C engine fetch -q --depth 1 origin "$ENGINE_REF"
          git -C engine checkout -q FETCH_HEAD
          cd engine/src
          make -j"$(nproc)" net
          PATH="$NDK_BIN:$PATH" make -j"$(nproc)" build ARCH=armv8 COMP=ndk EXTRALDFLAGS="-static" > ../build.log 2>&1 \
            || { tail -40 ../build.log; exit 1; }
          "$NDK_BIN/llvm-strip" stockfish
          file stockfish
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          cp stockfish "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libsmotherfish.so"
          echo "Bundled Smotherfish $(git -C .. rev-parse --short HEAD) ($ENGINE_REF)"

      # The project's signing key, for the APKs meant for installing (pushes
      # to main, runs by hand). Not for pull requests: their code could print
      # it. Without the secrets the build falls back to the debug key.
      - name: Signing key
        id: key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "no signing key: the debug key is used"; exit 0; fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/chessoverlay-signing.p12"
          echo "file=$RUNNER_TEMP/chessoverlay-signing.p12" >> "$GITHUB_OUTPUT"

      - name: Build the APK
        run: ./gradlew --no-daemon assembleRelease
        env:
          SIGNING_STORE_FILE: ${{ steps.key.outputs.file }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: The APK's signer
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -iE 'certificate SHA-256|Signer #1 certificate DN' | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: chessoverlay-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            core/build/reports/tests/
          retention-days: 7

      # Renderings of the overlay on a phone-sized board, for review.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overlay-previews
          path: core/build/preview/
          retention-days: 14

      # A few of the benchmark's pictures, to see that they show what they should.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-samples
          path: |
            build/bench/b000.png
            build/bench/b005.png
            build/bench/b020.png
            build/bench/b077.png
          retention-days: 7
          if-no-files-found: ignore

      # What the benchmark of board reading said (BenchTest's table).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-report
          path: build/bench/report.txt
          retention-days: 30

      # What Gradle puts on the app's classpaths (all of its configurations),
      # so that the Kotlin can be compiled where the Android Gradle plugin
      # cannot run: tools/compile.py reads the three that matter in it.
      - name: The compile classpath
        run: ./gradlew --no-daemon -q :app:dependencies > classpath.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compile-classpath
          path: classpath.txt
          retention-days: 30

  # The engine from the APK on real arm64 hardware (Linux, not Android, but
  # the same static binary), run by the app's own engine code with 4 threads
  # as on a phone: an engine that is silent on ARM shows up here.
  engine-arm64:
    needs: apk
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/download-artifact@v4
        with:
          name: chessoverlay-apk
          path: apk

      - name: The engine from the APK
        run: |
          unzip -q -o apk/app-release.apk 'lib/arm64-v8a/libsmotherfish.so' -d apk/x
          chmod +x apk/x/lib/arm64-v8a/libsmotherfish.so
          echo "cores: $(nproc)"; uname -m
          timeout 300 apk/x/lib/arm64-v8a/libsmotherfish.so bench 16 1 12 2>&1 | tail -4

      - name: The app's engine code against it
        run: |
          CORE_ONLY=1 ENGINE_BIN="$PWD/apk/x/lib/arm64-v8a/libsmotherfish.so" ENGINE_THREADS=4 ENGINE_SECS=5 \
            ./gradlew --no-daemon :core:test --tests '*EngineHostTest*'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-arm64-reports
          path: core/build/reports/tests/
          retention-days: 7

  # The app's Android-only parts on a real Android system: an x86_64
  # emulator, with Smotherfish built for x86_64 and the models pushed in.
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
          echo "NDK_BIN=$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_ENV"

      - name: Build Smotherfish (x86_64, for the emulator)
        run: |
          git init -q engine
          git -C engine remote add origin https://github.com/Demonic1594/Smotherfish.git
          git -C engine fetch -q --depth 1 origin "$ENGINE_REF"
          git -C engine checkout -q FETCH_HEAD
          cd engine/src
          make -j"$(nproc)" net
          PATH="$NDK_BIN:$PATH" make -j"$(nproc)" build ARCH=x86-64 COMP=ndk EXTRALDFLAGS="-static" > ../build.log 2>&1 \
            || { tail -40 ../build.log; exit 1; }
          "$NDK_BIN/llvm-strip" stockfish
          file stockfish
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/x86_64"
          cp stockfish "$GITHUB_WORKSPACE/app/src/main/jniLibs/x86_64/libsmotherfish.so"

      - name: Recognition models (cached)
        uses: actions/cache@v4
        with:
          path: models
          key: chessimg2pos-v2-onnx-0.2.0

      - name: Download recognition models
        run: |
          if [ ! -f models/board.onnx ]; then
            mkdir -p models
            curl -fsSL -o models/v2.zip https://github.com/mdicio/chessimg2pos/releases/download/v0.2.0/chessimg2pos-v2-onnx.zip
            unzip -q -o models/v2.zip -d models && rm models/v2.zip
          fi

      - name: Build the test APKs
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest -PextraAbi=x86_64

      - name: Instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          ram-size: 4096M
          disk-size: 6G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb shell mkdir -p /data/local/tmp/models
            adb push models/board.onnx models/locator.onnx /data/local/tmp/models/
            adb shell chmod 644 /data/local/tmp/models/board.onnx /data/local/tmp/models/locator.onnx
            ./gradlew --no-daemon connectedDebugAndroidTest -PextraAbi=x86_64 -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true || touch tests-failed
            mkdir -p device-out && adb pull /sdcard/Android/data/io.github.chessoverlay/files/test-out device-out/ || true
            adb logcat -d > device-out/logcat.txt || true
            test ! -f tests-failed

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-output
          path: |
            device-out/
            app/build/outputs/connected_android_test_additional_output/
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          retention-days: 14
