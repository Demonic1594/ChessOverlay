# Builds and tests the APK. Runs for pull requests, pushes to main and by
# hand; the jobs:
# - apk: Smotherfish's release builds for arm64 (plain and dot product)
#   bundled as libsmotherfish.so and libsmotherfish_dotprod.so, the
#   recognition models, the unit tests (the recognizer against
#   chessimg2pos's recorded Python output), then app-release.apk as an
#   artifact. For pushes to main and runs by hand it is signed with the
#   project key (secrets ANDROID_KEYSTORE_*), so that a newer build installs
#   over an older one; a pull request's APK with the debug key of the build
#   machine, a new one each run (docs/development.md, Signing in CI);
# - engine-arm64: the engines from that APK on real arm64 hardware, run by
#   the app's own engine code;
# - device: the app on an x86_64 emulator, with an x86_64 Smotherfish.
# The engine is the release pinned below (ENGINE_RELEASE), so that a build
# can be repeated and the APK's engine source is known (see
# THIRD_PARTY_NOTICES.md), unless the workflow is run by hand with another
# release tag.
name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      engine_release:
        description: "Smotherfish release tag to bundle (default: the one pinned below)"
        required: false
        default: ""

env:
  # The Smotherfish release bundled: its Android builds, checked against
  # the SHA-256 sums below. To move on, change the release, the two sums
  # (the release page lists them) and the commit, and THIRD_PARTY_NOTICES.md.
  DEFAULT_RELEASE: v1.5.1
  ENGINE_RELEASE: ${{ github.event.inputs.engine_release || 'v1.5.1' }}
  SHA_PLAIN: 0bb8327e0c9d2985bd5f907f27090f691f9e30d863dd049cd67d06c2612e0f1a
  SHA_DOTPROD: 4f4eb4886bf91b73005b33f11e7a8ff4c0a1197f2862f7d09b99f119c3731821
  # The emulator needs an x86_64 build, which the release does not have:
  # built from the release's tag (its commit f01cf48 for v1.5.1).
  ENGINE_REF: ${{ github.event.inputs.engine_release || 'v1.5.1' }}
  NDK_VERSION: "27.2.12479018"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Recognition models (cached)
        uses: actions/cache@v4
        with:
          path: models
          key: chessimg2pos-v2-onnx-0.2.0

      - name: Download recognition models
        run: |
          if [ ! -f models/board.onnx ]; then
            mkdir -p models
            curl -fsSL -o models/v2.zip https://github.com/mdicio/chessimg2pos/releases/download/v0.2.0/chessimg2pos-v2-onnx.zip
            unzip -q -o models/v2.zip -d models && rm models/v2.zip
          fi
          ls -la models

      # The APK carries the models: the board model quantized to int8 (same
      # readings, about twice as fast, 38 MB instead of 125 MB), checked by
      # QuantizedModelTest below.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bundle the recognition models
        run: |
          python3 -m venv /tmp/quant
          /tmp/quant/bin/pip install --quiet "onnxruntime==1.20.1" "onnx==1.17.0"
          /tmp/quant/bin/python tools/quantize_models.py models app/src/main/assets/models

      # The benchmark of board reading: boards as lichess shows them, rendered
      # with Chrome (BenchTest reads the directory; its table is uploaded).
      - name: Benchmark boards
        run: |
          python3 -m venv /tmp/bench
          /tmp/bench/bin/pip install --quiet "chess==1.11.2"
          /tmp/bench/bin/python tools/bench/gen.py "$GITHUB_WORKSPACE/build/bench" --boards 200 --hard 40

      - name: Unit tests
        run: |
          MODELS="$GITHUB_WORKSPACE/models" QMODELS="$GITHUB_WORKSPACE/app/src/main/assets/models" BENCH="$GITHUB_WORKSPACE/build/bench" \
            ./gradlew --no-daemon :core:test testDebugUnitTest

      # The engine comes after the tests: a change in the Kotlin shows in the
       # tests a few minutes sooner, and they do not need it.
      # Smotherfish's own release builds (the network is inside each binary, about 140 MB): the plain Armv8
      # build and the faster Armv8.2 dot-product one. The app starts the faster one where the CPU has those
      # instructions (EngineRegistry), the plain one elsewhere. Each file is checked against its SHA-256 before
      # it goes into the APK: pinned below for the default release, the release's own digest for another tag.
      - name: Smotherfish ${{ env.ENGINE_RELEASE }} (release builds)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="https://github.com/Demonic1594/Smotherfish/releases/download/$ENGINE_RELEASE"
          v="${ENGINE_RELEASE#v}"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          for pair in "android-arm64:libsmotherfish.so" "android-arm64-dotprod:libsmotherfish_dotprod.so"; do
            asset="smotherfish-$v-${pair%%:*}"; lib="${pair##*:}"
            curl -fsSL --retry 4 --retry-delay 5 -o "app/src/main/jniLibs/arm64-v8a/$lib" "$base/$asset"
            if [ "$ENGINE_RELEASE" = "$DEFAULT_RELEASE" ]; then
              want=$(case "$asset" in *-dotprod) echo "$SHA_DOTPROD";; *) echo "$SHA_PLAIN";; esac)
            else
              want=$(gh api "repos/Demonic1594/Smotherfish/releases/tags/$ENGINE_RELEASE" \
                --jq ".assets[] | select(.name == \"$asset\") | .digest" | sed 's/^sha256://')
            fi
            got=$(sha256sum "app/src/main/jniLibs/arm64-v8a/$lib" | cut -d' ' -f1)
            [ -n "$want" ] && [ "$got" = "$want" ] || { echo "$asset: SHA-256 $got, expected ${want:-none}"; exit 1; }
            chmod +x "app/src/main/jniLibs/arm64-v8a/$lib"
            file "app/src/main/jniLibs/arm64-v8a/$lib"
            echo "Bundled $asset as $lib ($got)"
          done

      # The project's signing key, for the APKs meant for installing (pushes
      # to main, runs by hand). Not for pull requests: their code could print
      # it. Without the secrets the build falls back to the debug key.
      - name: Signing key
        id: key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "no signing key: the debug key is used"; exit 0; fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/chessoverlay-signing.p12"
          echo "file=$RUNNER_TEMP/chessoverlay-signing.p12" >> "$GITHUB_OUTPUT"

      - name: Build the APK
        run: ./gradlew --no-daemon assembleRelease
        env:
          SIGNING_STORE_FILE: ${{ steps.key.outputs.file }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: The APK's signer
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -iE 'certificate SHA-256|Signer #1 certificate DN' | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: chessoverlay-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            core/build/reports/tests/
          retention-days: 7

      # Renderings of the overlay on a phone-sized board, for review.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overlay-previews
          path: core/build/preview/
          retention-days: 14

      # A few of the benchmark's pictures, to see that they show what they should.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-samples
          path: |
            build/bench/b000.png
            build/bench/b005.png
            build/bench/b020.png
            build/bench/b077.png
          retention-days: 7
          if-no-files-found: ignore

      # What the benchmark of board reading said (BenchTest's table).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-report
          path: build/bench/report.txt
          retention-days: 30

      # What Gradle puts on the app's classpaths (all of its configurations),
      # so that the Kotlin can be compiled where the Android Gradle plugin
      # cannot run: tools/compile.py reads the three that matter in it.
      - name: The compile classpath
        run: ./gradlew --no-daemon -q :app:dependencies > classpath.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compile-classpath
          path: classpath.txt
          retention-days: 30

  # The engine from the APK on real arm64 hardware (Linux, not Android, but
  # the same static binary), run by the app's own engine code with 4 threads
  # as on a phone: an engine that is silent on ARM shows up here.
  engine-arm64:
    needs: apk
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: actions/download-artifact@v4
        with:
          name: chessoverlay-apk
          path: apk

      - name: The engines from the APK
        run: |
          unzip -q -o apk/app-release.apk 'lib/arm64-v8a/libsmotherfish*.so' -d apk/x
          chmod +x apk/x/lib/arm64-v8a/libsmotherfish*.so
          echo "cores: $(nproc)"; uname -m
          grep -m1 '^Features' /proc/cpuinfo
          for e in apk/x/lib/arm64-v8a/libsmotherfish.so apk/x/lib/arm64-v8a/libsmotherfish_dotprod.so; do
            echo "== $e"
            timeout 300 "$e" bench 16 1 12 2>&1 | tail -4
          done

      # The faster build where it runs (this runner's CPU has the dot product), as a phone from 2019 on would.
      - name: The app's engine code against it
        run: |
          bin=apk/x/lib/arm64-v8a/libsmotherfish.so
          grep -qw asimddp /proc/cpuinfo && bin=apk/x/lib/arm64-v8a/libsmotherfish_dotprod.so
          echo "testing $bin"
          CORE_ONLY=1 ENGINE_BIN="$PWD/$bin" ENGINE_THREADS=4 ENGINE_SECS=5 \
            ./gradlew --no-daemon :core:test --tests '*EngineHostTest*'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-arm64-reports
          path: core/build/reports/tests/
          retention-days: 7

  # The app's Android-only parts on a real Android system: an x86_64
  # emulator, with Smotherfish built for x86_64 and the models pushed in.
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # A branch or tag given by hand is resolved to its commit, so the cache never serves an older build of it.
      - name: Engine commit
        run: |
          refs=$(git ls-remote https://github.com/Demonic1594/Smotherfish.git "$ENGINE_REF" "refs/tags/$ENGINE_REF^{}")
          # An annotated tag: its commit (the "^{}" line), not the tag object.
          sha=$(echo "$refs" | grep '\^{}$' | cut -f1 | head -1)
          [ -n "$sha" ] || sha=$(echo "$refs" | head -1 | cut -f1)
          echo "ENGINE_SHA=${sha:-$ENGINE_REF}" >> "$GITHUB_ENV"

      # The engine only changes with ENGINE_REF (and the NDK): built once, then taken from the cache.
      - name: Smotherfish x86_64 (cached)
        id: engine-x86_64
        uses: actions/cache@v4
        with:
          path: engine-x86_64
          key: smotherfish-x86_64-${{ env.ENGINE_SHA }}-ndk${{ env.NDK_VERSION }}

      - name: Android NDK
        if: steps.engine-x86_64.outputs.cache-hit != 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
          echo "NDK_BIN=$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_ENV"

      - name: Build Smotherfish (x86_64, for the emulator)
        if: steps.engine-x86_64.outputs.cache-hit != 'true'
        run: |
          git init -q engine
          git -C engine remote add origin https://github.com/Demonic1594/Smotherfish.git
          git -C engine fetch -q --depth 1 origin "$ENGINE_SHA"
          git -C engine checkout -q FETCH_HEAD
          cd engine/src
          make -j"$(nproc)" net
          PATH="$NDK_BIN:$PATH" make -j"$(nproc)" build ARCH=x86-64 COMP=ndk EXTRALDFLAGS="-static" > ../build.log 2>&1 \
            || { tail -40 ../build.log; exit 1; }
          "$NDK_BIN/llvm-strip" stockfish
          file stockfish
          mkdir -p "$GITHUB_WORKSPACE/engine-x86_64"
          cp stockfish "$GITHUB_WORKSPACE/engine-x86_64/libsmotherfish.so"
          git -C .. rev-parse --short HEAD > "$GITHUB_WORKSPACE/engine-x86_64/commit"

      - name: Bundle Smotherfish (x86_64)
        run: |
          mkdir -p app/src/main/jniLibs/x86_64
          cp engine-x86_64/libsmotherfish.so app/src/main/jniLibs/x86_64/
          echo "Bundled Smotherfish $(cat engine-x86_64/commit) ($ENGINE_REF)"

      - name: Recognition models (cached)
        uses: actions/cache@v4
        with:
          path: models
          key: chessimg2pos-v2-onnx-0.2.0

      - name: Download recognition models
        run: |
          if [ ! -f models/board.onnx ]; then
            mkdir -p models
            curl -fsSL -o models/v2.zip https://github.com/mdicio/chessimg2pos/releases/download/v0.2.0/chessimg2pos-v2-onnx.zip
            unzip -q -o models/v2.zip -d models && rm models/v2.zip
          fi

      - name: Build the test APKs
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest -PextraAbi=x86_64

      - name: Instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          ram-size: 4096M
          disk-size: 6G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb shell mkdir -p /data/local/tmp/models
            adb push models/board.onnx models/locator.onnx /data/local/tmp/models/
            adb shell chmod 644 /data/local/tmp/models/board.onnx /data/local/tmp/models/locator.onnx
            ./gradlew --no-daemon connectedDebugAndroidTest -PextraAbi=x86_64 -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true || touch tests-failed
            mkdir -p device-out && adb pull /sdcard/Android/data/io.github.chessoverlay/files/test-out device-out/ || true
            adb logcat -d > device-out/logcat.txt || true
            test ! -f tests-failed

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-output
          path: |
            device-out/
            app/build/outputs/connected_android_test_additional_output/
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          retention-days: 14
