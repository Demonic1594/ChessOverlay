# Writes the coordinates of the app module's compile classpath (the app's code,
# its JVM tests and its Android tests): what Gradle really puts on it. With
# that, tools/compile.py can compile the Kotlin on a machine where the Android
# Gradle plugin cannot run (a phone), in seconds instead of one CI run.
#
# Run by hand when a dependency changes, and copy the artifact's list into
# tools/compile-classpath.txt.
name: Compile classpath

on:
  workflow_dispatch:

jobs:
  classpath:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: The classpath
        run: |
          {
            ./gradlew --no-daemon -q :app:dependencies --configuration debugCompileClasspath
            ./gradlew --no-daemon -q :app:dependencies --configuration debugUnitTestCompileClasspath
            ./gradlew --no-daemon -q :app:dependencies --configuration debugAndroidTestCompileClasspath
          } > classpath.txt
          grep -oE '\b[a-zA-Z0-9_.-]+:[a-zA-Z0-9_.-]+:[0-9][a-zA-Z0-9_.+-]*' classpath.txt | sort -u > coordinates.txt
          wc -l coordinates.txt

      - uses: actions/upload-artifact@v4
        with:
          name: compile-classpath
          path: coordinates.txt
          retention-days: 30
